name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable so release.yml can gate a tagged release on the full CI suite.
  # Tag pushes don't match the triggers above, so without this a release would
  # publish signed binaries from a commit CI never checked.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to 1.93: Rust 1.94+ clippy overflows the query depth limit while
      # computing the layout of matrix-sdk's huge `Client::sync()` future
      # ("queries overflow the depth limit!"). It's a regression in the
      # dependency's generated code that we can't edit. Revisit when a newer
      # matrix-sdk or clippy fixes it.
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      # Regression guard: openssl-sys previously broke aarch64 cross-compiling
      # (needs target-arch headers + a cross pkg-config sysroot) and is why the
      # dependency tree switched to rustls-tls. Catches it coming back through
      # a future dependency bump re-enabling a native-tls feature.
      - name: Assert openssl-sys stays out of the dependency graph
        run: |
          if cargo tree -e normal,build -i openssl-sys >/dev/null 2>&1; then
            echo "::error::openssl-sys is back in the dependency graph -- this breaks aarch64 cross-compilation" >&2
            cargo tree -e normal,build -i openssl-sys >&2
            exit 1
          fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # Enforce the declared minimum supported Rust version.
      - run: cargo check --all-targets

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      # Fails on known security vulnerabilities in the dependency tree.
      - run: cargo audit

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # shellcheck ships preinstalled on the ubuntu-latest runner image.
      - run: shellcheck install.sh

  # Exercises install.sh for real: latest-release resolution, download,
  # checksum + cosign verification, and installing to the actual system paths
  # (/usr/local/bin, /etc/chimney-post, /etc/systemd/system) via the script's
  # own internal `sudo` calls. Safe here because the runner is a disposable
  # VM. This intentionally installs whatever release is currently published
  # (not something built from this PR) -- it is a test of the installer's
  # mechanics, not of in-flight source changes.
  install-script:
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4
      - name: Rejects an invalid CHIMNEY_MTA
        run: |
          if CHIMNEY_MTA=bogus bash install.sh; then
            echo "::error::expected failure for an invalid CHIMNEY_MTA value" >&2
            exit 1
          fi
      # Runner user has passwordless sudo, so this exercises the script's
      # internal $SUDO path without any prompt. Default CHIMNEY_MTA=ask with
      # no controlling terminal on the runner, so this also covers the
      # non-interactive auto-skip path; timeout guards against a `read`
      # somehow blocking instead.
      - name: Install (real defaults, unprivileged user, sudo internally)
        run: timeout 120 bash install.sh
      - name: Binary is installed and runs
        run: |
          test -x /usr/local/bin/chimney-post
          out=$(CHIMNEY_CONFIG=/nonexistent/chimney-post.toml /usr/local/bin/chimney-post 2>&1) && rc=0 || rc=$?
          if [ "${rc:-0}" -ne 1 ]; then
            echo "::error::expected exit 1 from config load failure, got ${rc:-0}" >&2
            exit 1
          fi
          case "$out" in
            *"/nonexistent/chimney-post.toml"*) ;;
            *) echo "::error::binary did not reach its config loader" >&2; exit 1 ;;
          esac
      - name: Template config and systemd unit are installed correctly
        run: |
          test -f /etc/chimney-post/config.toml
          [ "$(stat -c %a /etc/chimney-post/config.toml)" = "600" ]
          test -f /etc/systemd/system/chimney-post.service
          systemd-analyze verify /etc/systemd/system/chimney-post.service
      - name: Re-running never clobbers an existing config
        run: |
          echo "# ci marker" | sudo tee -a /etc/chimney-post/config.toml >/dev/null
          CHIMNEY_MTA=no bash install.sh
          # config.toml is 0600 root-owned, so reading it back needs sudo too.
          sudo grep -q "# ci marker" /etc/chimney-post/config.toml
      - name: Custom install prefix and CHIMNEY_SKIP_SYSTEMD both work
        run: |
          CHIMNEY_INSTALL_PREFIX="$RUNNER_TEMP/bin" CHIMNEY_SKIP_SYSTEMD=1 CHIMNEY_MTA=no bash install.sh
          test -x "$RUNNER_TEMP/bin/chimney-post"
      - name: msmtp setup (apt) installs a working sendmail
        run: |
          CHIMNEY_MTA=yes bash install.sh
          command -v sendmail
          sudo test -e /etc/msmtprc

  # install.sh's msmtp setup supports several OS families beyond Debian/Ubuntu
  # (see the comment above setup_msmtp in install.sh for what's verified where
  # and why). GitHub-hosted runners only come as Ubuntu, so those other
  # families are exercised in disposable containers on top of the ubuntu-latest
  # runner instead of as native runners. yum-only RHEL (pre-8) isn't covered
  # here -- it shares setup_msmtp_dnf's logic with the dnf case below, just
  # under a different binary name.
  install-script-mta:
    needs: shellcheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm --needed sudo curl tar coreutils which
          - name: fedora
            image: fedora:latest
            # util-linux for `su` -- this base image doesn't include it.
            bootstrap: dnf -y install sudo curl tar coreutils which util-linux
          - name: rhel (rockylinux, via EPEL)
            image: rockylinux:9
            # curl/coreutils here are the -minimal/-single variants the base
            # image already ships; installing the full packages alongside
            # them conflicts (see setup_msmtp_dnf's EPEL handling for msmtp
            # itself, exercised by this job).
            bootstrap: dnf -y install sudo tar which
          - name: opensuse
            image: opensuse/tumbleweed:latest
            bootstrap: zypper --non-interactive install sudo curl tar coreutils which
    steps:
      - uses: actions/checkout@v7
      - name: "${{ matrix.name }}: msmtp setup installs a working sendmail"
        run: |
          docker run --rm -v "$PWD/install.sh:/work/install.sh:ro" "${{ matrix.image }}" bash -euxc '
            ${{ matrix.bootstrap }}
            curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
            chmod +x /usr/local/bin/cosign
            useradd -m -s /bin/bash runner
            echo "runner ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/runner
            chmod 0440 /etc/sudoers.d/runner
            su -s /bin/bash runner -c "CHIMNEY_SKIP_SYSTEMD=1 CHIMNEY_MTA=yes bash /work/install.sh"
            # Checked as root, not via su: a non-login su on some distros
            # (openSUSE) strips PATH down to exclude /usr/sbin, where sendmail
            # lives -- a test-harness quirk, not something a real login shell hits.
            command -v sendmail
            test -e /etc/msmtprc
          '
