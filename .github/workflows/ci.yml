name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable so release.yml can gate a tagged release on the full CI suite.
  # Tag pushes don't match the triggers above, so without this a release would
  # publish signed binaries from a commit CI never checked.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to 1.93: Rust 1.94+ clippy overflows the query depth limit while
      # computing the layout of matrix-sdk's huge `Client::sync()` future
      # ("queries overflow the depth limit!"). It's a regression in the
      # dependency's generated code that we can't edit. Revisit when a newer
      # matrix-sdk or clippy fixes it.
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      # Regression guard: openssl-sys previously broke aarch64 cross-compiling
      # (needs target-arch headers + a cross pkg-config sysroot) and is why the
      # dependency tree switched to rustls-tls. Catches it coming back through
      # a future dependency bump re-enabling a native-tls feature.
      - name: Assert openssl-sys stays out of the dependency graph
        run: |
          if cargo tree -e normal,build -i openssl-sys >/dev/null 2>&1; then
            echo "::error::openssl-sys is back in the dependency graph -- this breaks aarch64 cross-compilation" >&2
            cargo tree -e normal,build -i openssl-sys >&2
            exit 1
          fi

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # Enforce the declared minimum supported Rust version.
      - run: cargo check --all-targets

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      # Fails on known security vulnerabilities in the dependency tree.
      - run: cargo audit

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # shellcheck ships preinstalled on the ubuntu-latest runner image.
      - run: shellcheck install.sh

  # Builds the distroless image from *this* checkout (unlike the
  # release.yml docker-build-push job, which builds the same Dockerfile
  # against a tagged release) and proves the packaging promises actually
  # hold: runs as the declared non-root UID, has no shell at all, and the
  # SMTP server actually comes up and accepts connections.
  docker-image:
    # Skipped on tag pushes, same reasoning as the install-script jobs below:
    # this pulls rust:1.93-bookworm anonymously from Docker Hub on shared
    # GitHub runner IPs, so leaving it on the release path would let a Docker
    # Hub rate limit block publishing a release. Nothing is lost there --
    # release.yml's docker-build-push builds this same Dockerfile from the
    # same commit.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: chimney-post:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runs as the declared non-root UID
        run: |
          user="$(docker inspect --format '{{.Config.User}}' chimney-post:ci)"
          if [ "$user" != "65532:65532" ]; then
            echo "::error::expected image user 65532:65532, got '$user'" >&2
            exit 1
          fi
      # Control for the smoke test below: if the image ever grew a shell
      # (e.g. a base image swap), the SMTP check would still pass for reasons
      # that have nothing to do with the image actually being distroless.
      - name: Control -- image has no shell
        run: |
          if docker run --rm --entrypoint sh chimney-post:ci -c true; then
            echo "::error::image unexpectedly has a working shell -- not distroless" >&2
            exit 1
          fi
      - name: Config load failure surfaces correctly
        run: |
          out=$(docker run --rm -e CHIMNEY_CONFIG=/nonexistent/chimney-post.toml chimney-post:ci 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "${rc:-0}" -ne 1 ]; then
            echo "::error::expected exit 1 from config load failure, got ${rc:-0}" >&2
            exit 1
          fi
          case "$out" in
            *"/nonexistent/chimney-post.toml"*) ;;
            *) echo "::error::binary did not reach its config loader" >&2; exit 1 ;;
          esac
      # A minimal but real config (bogus Matrix creds) -- the SMTP listener
      # must come up regardless, per the "resilient startup" design: the
      # Matrix connection is backgrounded and retried, never gates accepting
      # mail. This is the same property README documents and users rely on.
      - name: Container starts and the SMTP port answers
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/config.toml" <<'EOF'
          [smtp]
          bind = "0.0.0.0:2525"
          max_message_size = 10485760
          timeout = 30
          max_connections = 100
          max_session_seconds = 300

          [matrix]
          homeserver = "https://matrix.example.org"
          user_id = "@bot:example.org"
          device_name = "chimney-post"
          room_id = "!roomid:example.org"
          store_path = "/var/lib/chimney-post/matrix-store"

          [matrix.credentials]
          password = "${MATRIX_PASSWORD}"
          device_id = "chimney-post"

          [logging]
          level = "info"
          format = "json"

          [queue]
          max_retries = 5
          retry_backoff = 60
          db_path = "/var/lib/chimney-post/queue.db"
          max_len = 10000
          EOF
          docker run -d --name cp-ci -p 12525:2525 \
            -v "$RUNNER_TEMP/config.toml:/etc/chimney-post/config.toml:ro" \
            -e MATRIX_PASSWORD=dummy \
            chimney-post:ci
          # Read the actual SMTP greeting rather than just checking that a
          # connection can be opened. `nc -z` completes docker-proxy's
          # host-side handshake even when nothing usable is behind it -- a
          # container bound to the *container's* own 127.0.0.1, or one that
          # already crashed, both still accept and then close with zero
          # bytes. Requiring a 220 banner is what actually proves the SMTP
          # server is listening on an address reachable from outside.
          ok=0
          for _ in $(seq 1 10); do
            if printf 'QUIT\r\n' | nc -w 3 127.0.0.1 12525 | grep -q '^220 '; then
              ok=1
              break
            fi
            sleep 1
          done
          docker logs cp-ci
          status="$(docker inspect -f '{{.State.Status}}' cp-ci)"
          if [ "$ok" -ne 1 ] || [ "$status" != "running" ]; then
            echo "::error::no SMTP 220 greeting, or container exited (status: $status)" >&2
            exit 1
          fi
          docker rm -f cp-ci >/dev/null

  # Validates the unit file in *this* checkout. install.sh deliberately fetches
  # the unit from the release tag, so the install-script jobs below can only
  # ever exercise the already-published one -- this job is what covers changes
  # to systemd/chimney-post.service before they ship. It needs no published
  # release, so unlike those jobs it also runs as part of a release.
  systemd-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit file is valid
        run: |
          sudo install -m 0755 /bin/true /usr/local/bin/chimney-post
          sudo cp systemd/chimney-post.service /etc/systemd/system/
          sudo systemctl daemon-reload
          systemd-analyze verify /etc/systemd/system/chimney-post.service
      # The unit runs DynamicUser=yes, so the service is a transient non-root UID
      # and cannot open the 0600 root-owned config.toml that install.sh and the
      # README both create. It gets at it through LoadCredential= instead. Prove
      # that works under the unit's full sandbox by running the real unit with
      # ExecStart swapped for a command that just reads the config.
      - name: Service can read a 0600 root-owned config through its credential
        run: |
          sudo install -d -m 0755 /etc/chimney-post
          sudo install -m 0600 config.example.toml /etc/chimney-post/config.toml
          sudo mkdir -p /etc/systemd/system/chimney-post.service.d
          # Type=oneshot so `systemctl start` waits for the result and reports it;
          # Restart= must go with it, because systemd rejects on-failure for
          # oneshot units. ${CHIMNEY_CONFIG} is systemd's own single-word
          # expansion, so this also checks Environment= points somewhere real.
          sudo tee /etc/systemd/system/chimney-post.service.d/ci-readcheck.conf >/dev/null <<'EOF'
          [Service]
          Type=oneshot
          Restart=no
          WatchdogSec=0
          TimeoutStartSec=30
          ExecStart=
          ExecStart=/usr/bin/grep -qF [matrix] ${CHIMNEY_CONFIG}
          EOF
          sudo systemctl daemon-reload
          if ! sudo systemctl start chimney-post.service; then
            echo "::error::the service could not read its config -- see the journal below" >&2
            sudo journalctl -u chimney-post.service --no-pager -n 50 >&2
            exit 1
          fi
      # Control. Without this, the test above would still pass if config.toml
      # were world-readable or the sandbox were dropped -- i.e. for reasons that
      # have nothing to do with the credential actually working.
      - name: Control -- the same sandbox cannot read that config directly
        run: |
          if sudo systemd-run --wait --collect --service-type=oneshot \
               -p DynamicUser=yes \
               /usr/bin/grep -qF "[matrix]" /etc/chimney-post/config.toml; then
            echo "::error::a DynamicUser service read the 0600 config directly -- the credential test proves nothing" >&2
            exit 1
          fi

  # Exercises install.sh for real: latest-release resolution, download,
  # checksum + cosign verification, and installing to the actual system paths
  # (/usr/local/bin, /etc/chimney-post, /etc/systemd/system) via the script's
  # own internal `sudo` calls. Safe here because the runner is a disposable
  # VM. This intentionally installs whatever release is currently published
  # (not something built from this PR) -- it is a test of the installer's
  # mechanics, not of in-flight source changes.
  install-script:
    # Skipped on tag pushes. ci.yml is workflow_call-ed by release.yml as the
    # release gate, and this job installs whatever release is *currently*
    # published -- so leaving it in that path would gate each release on the
    # previous release's assets still being downloadable, and would deadlock a
    # repository's very first release, where there is nothing to install yet.
    # github.ref is the caller's ref for a called workflow, i.e. refs/tags/vX.Y.Z.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4
      - name: Rejects an invalid CHIMNEY_MTA
        run: |
          if CHIMNEY_MTA=bogus bash install.sh; then
            echo "::error::expected failure for an invalid CHIMNEY_MTA value" >&2
            exit 1
          fi
      # Runner user has passwordless sudo, so this exercises the script's
      # internal $SUDO path without any prompt. Default CHIMNEY_MTA=ask with
      # no controlling terminal on the runner, so this also covers the
      # non-interactive auto-skip path; timeout guards against a `read`
      # somehow blocking instead.
      - name: Install (real defaults, unprivileged user, sudo internally)
        run: timeout 120 bash install.sh
      - name: Binary is installed and runs
        run: |
          test -x /usr/local/bin/chimney-post
          out=$(CHIMNEY_CONFIG=/nonexistent/chimney-post.toml /usr/local/bin/chimney-post 2>&1) && rc=0 || rc=$?
          if [ "${rc:-0}" -ne 1 ]; then
            echo "::error::expected exit 1 from config load failure, got ${rc:-0}" >&2
            exit 1
          fi
          case "$out" in
            *"/nonexistent/chimney-post.toml"*) ;;
            *) echo "::error::binary did not reach its config loader" >&2; exit 1 ;;
          esac
      - name: Template config and systemd unit are installed correctly
        run: |
          test -f /etc/chimney-post/config.toml
          [ "$(stat -c %a /etc/chimney-post/config.toml)" = "600" ]
          test -f /etc/systemd/system/chimney-post.service
          systemd-analyze verify /etc/systemd/system/chimney-post.service
      - name: Re-running never clobbers an existing config
        run: |
          echo "# ci marker" | sudo tee -a /etc/chimney-post/config.toml >/dev/null
          CHIMNEY_MTA=no bash install.sh
          # config.toml is 0600 root-owned, so reading it back needs sudo too.
          sudo grep -q "# ci marker" /etc/chimney-post/config.toml
      # Guards the unit rewrite: a custom CHIMNEY_CONFIG_DIR has to reach the
      # installed unit, or the service starts up pointing at a config path that
      # does not exist. Runs before the custom-prefix step below; the later
      # default-path install restores /etc/systemd/system/chimney-post.service.
      - name: Custom config dir is propagated into the systemd unit
        run: |
          CHIMNEY_CONFIG_DIR="$RUNNER_TEMP/etc" CHIMNEY_MTA=no bash install.sh
          sudo test -f "$RUNNER_TEMP/etc/config.toml"
          grep -qF "$RUNNER_TEMP/etc/config.toml" /etc/systemd/system/chimney-post.service
          # Anchored to directive lines so an explanatory comment mentioning the
          # default path doesn't read as a failure to rewrite it.
          if grep -qE '^(LoadCredential=config:|Environment=CHIMNEY_CONFIG=)/etc/chimney-post/config\.toml' \
              /etc/systemd/system/chimney-post.service; then
            echo "::error::unit still points at the default config path" >&2
            exit 1
          fi
          systemd-analyze verify /etc/systemd/system/chimney-post.service
      - name: Custom install prefix and CHIMNEY_SKIP_SYSTEMD both work
        run: |
          CHIMNEY_INSTALL_PREFIX="$RUNNER_TEMP/bin" CHIMNEY_SKIP_SYSTEMD=1 CHIMNEY_MTA=no bash install.sh
          test -x "$RUNNER_TEMP/bin/chimney-post"
      - name: msmtp setup (apt) installs a working sendmail
        run: |
          CHIMNEY_MTA=yes bash install.sh
          command -v sendmail
          sudo test -e /etc/msmtprc

  # Failure paths that only show up on a host the installer was never run on:
  # an MTA parked outside the invoking user's PATH, an optional package that
  # cannot be installed, a package manager root cannot reach, and systemd
  # installed but not running. Each of these used to end the run early -- after
  # the binary, config and unit were already in place -- so every case here
  # asserts the installer finished and printed its "Next steps" block, not just
  # that it exited 0. Containers on the ubuntu-latest runner, since GitHub does
  # not offer these as native runners.
  install-script-edge-cases:
    # Skipped on tag pushes, same reasoning as install-script above.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Regression guard for MTA detection. sendmail lives in /usr/sbin, which is
      # not on a regular user's PATH on Debian <=12, so a bare
      # `command -v sendmail` reports "no MTA" on a host that has one -- and
      # answering yes to the prompt then pulls in msmtp-mta, which
      # Provides/Conflicts mail-transport-agent and uninstalls the real MTA.
      # PATH is set explicitly rather than left to `su`, whose PATH handling
      # differs between distros, so the test asserts the same thing everywhere.
      - name: An MTA outside PATH is still detected
        run: |
          docker run --rm -v "$PWD/install.sh:/work/install.sh:ro" debian:12 bash -euxc '
            apt-get update -qq
            apt-get install -y -qq sudo curl tar ca-certificates
            printf "#!/bin/sh\nexit 0\n" > /usr/sbin/sendmail
            chmod +x /usr/sbin/sendmail
            useradd -m -s /bin/bash runner
            echo "runner ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/runner
            chmod 0440 /etc/sudoers.d/runner
            out=$(su -s /bin/bash runner -c "PATH=/usr/local/bin:/usr/bin:/bin CHIMNEY_SKIP_SYSTEMD=1 CHIMNEY_SKIP_VERIFY=1 bash /work/install.sh" 2>&1)
            echo "$out"
            case "$out" in
              *"already installed"*) ;;
              *) echo "::error::existing /usr/sbin/sendmail was not detected as an MTA" >&2; exit 1 ;;
            esac
            # And nothing replaced it.
            ! command -v msmtp
          '
      # setup_msmtp_nix warns and gives up when root cannot reach nix. That is a
      # skipped optional extra, not a failed install, but `|| return` propagated
      # its status and `set -e` killed the script at the call site. Reproduced by
      # putting nix where the invoking user can see it and sudo's secure_path
      # cannot. Alpine because detect_pkg_manager checks apt/dnf/yum/zypper/pacman
      # first -- nix is only reached on a host with none of them.
      - name: A skipped nix msmtp setup does not fail the install
        run: |
          docker run --rm -v "$PWD/install.sh:/work/install.sh:ro" alpine:latest sh -euxc '
            apk add --no-cache bash curl tar coreutils sudo
            adduser -D -s /bin/bash runner
            echo "runner ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/runner
            echo "Defaults secure_path=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> /etc/sudoers.d/runner
            chmod 0440 /etc/sudoers.d/runner
            mkdir -p /home/runner/bin
            printf "#!/bin/sh\nexit 0\n" > /home/runner/bin/nix
            chmod +x /home/runner/bin/nix
            chown -R runner /home/runner/bin
            rc=0
            su runner -c "PATH=/home/runner/bin:/usr/local/bin:/usr/bin:/bin CHIMNEY_SKIP_SYSTEMD=1 CHIMNEY_SKIP_VERIFY=1 CHIMNEY_MTA=yes bash /work/install.sh" > /tmp/out 2>&1 || rc=$?
            cat /tmp/out
            if [ "$rc" -ne 0 ]; then
              echo "::error::installer exited $rc after skipping an optional msmtp setup" >&2
              exit 1
            fi
            grep -q "Next steps" /tmp/out
            test -x /usr/local/bin/chimney-post
          '
      # The mail-reading client is documented as a convenience that must only
      # warn on failure, but apt, zypper and pacman used to install it in the
      # same transaction as msmtp behind a fatal `|| err`. The real trigger is a
      # conflicting mailutils; this shims apt-get instead, so the test turns on
      # the installer behaviour under test rather than on apt resolver
      # behaviour. /usr/local/sbin is first in sudo secure_path, so the shim is
      # what $SUDO apt-get finds.
      - name: A failing optional mail client only warns
        run: |
          docker run --rm -v "$PWD/install.sh:/work/install.sh:ro" debian:12 bash -euxc '
            apt-get update -qq
            apt-get install -y -qq sudo curl tar ca-certificates
            cat > /usr/local/sbin/apt-get <<"SHIM"
          #!/bin/sh
          for arg in "$@"; do
            [ "$arg" = "bsd-mailx" ] && exit 100
          done
          exec /usr/bin/apt-get "$@"
          SHIM
            chmod +x /usr/local/sbin/apt-get
            useradd -m -s /bin/bash runner
            echo "runner ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/runner
            chmod 0440 /etc/sudoers.d/runner
            rc=0
            su -s /bin/bash runner -c "CHIMNEY_SKIP_SYSTEMD=1 CHIMNEY_SKIP_VERIFY=1 CHIMNEY_MTA=yes bash /work/install.sh" > /tmp/out 2>&1 || rc=$?
            cat /tmp/out
            if [ "$rc" -ne 0 ]; then
              echo "::error::installer exited $rc over the optional mail client" >&2
              exit 1
            fi
            grep -q "Next steps" /tmp/out
            grep -q "bsd-mailx" /tmp/out
            # msmtp and its sendmail are what actually matter, and must be there.
            command -v msmtp
            test -e /usr/sbin/sendmail
            test -e /etc/msmtprc
          '
      # `command -v systemctl` alone was the guard, so `systemctl daemon-reload`
      # ran on WSL without systemd enabled, in LXC/chroots and in container
      # images that merely ship the binaries -- failing with "System has not
      # been booted with systemd" and taking the installer with it. Both halves
      # are checked: systemd absent as PID 1 (reload correctly skipped), and
      # /run/systemd/system present but the reload itself failing.
      - name: systemd installed but not running does not abort the install
        run: |
          docker run --rm -v "$PWD/install.sh:/work/install.sh:ro" debian:12 bash -euxc '
            apt-get update -qq
            apt-get install -y -qq sudo curl tar ca-certificates
            # /usr/local/bin, not /usr/local/sbin: it has to be on the invoking
            # user PATH (for command -v) as well as sudo secure_path.
            cat > /usr/local/bin/systemctl <<"SHIM"
          #!/bin/sh
          echo "System has not been booted with systemd as init system (PID 1)." >&2
          exit 1
          SHIM
            chmod +x /usr/local/bin/systemctl
            useradd -m -s /bin/bash runner
            echo "runner ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/runner
            chmod 0440 /etc/sudoers.d/runner

            test ! -d /run/systemd/system
            rc=0
            su -s /bin/bash runner -c "CHIMNEY_SKIP_VERIFY=1 CHIMNEY_MTA=no bash /work/install.sh" > /tmp/out 2>&1 || rc=$?
            cat /tmp/out
            if [ "$rc" -ne 0 ]; then
              echo "::error::installer exited $rc because systemd is not the running init" >&2
              exit 1
            fi
            grep -q "Next steps" /tmp/out
            grep -q "not the running init" /tmp/out
            # The unit is still installed, for whenever this image does boot.
            test -f /etc/systemd/system/chimney-post.service

            # Now let the reload be attempted, and fail.
            mkdir -p /run/systemd/system
            rc=0
            su -s /bin/bash runner -c "CHIMNEY_SKIP_VERIFY=1 CHIMNEY_MTA=no bash /work/install.sh" > /tmp/out2 2>&1 || rc=$?
            cat /tmp/out2
            if [ "$rc" -ne 0 ]; then
              echo "::error::installer exited $rc over a failed daemon-reload" >&2
              exit 1
            fi
            grep -q "Next steps" /tmp/out2
            grep -q "daemon-reload failed" /tmp/out2
          '

  # install.sh's msmtp setup supports several OS families beyond Debian/Ubuntu
  # (see the comment above setup_msmtp in install.sh for what's verified where
  # and why). GitHub-hosted runners only come as Ubuntu, so those other
  # families are exercised in disposable containers on top of the ubuntu-latest
  # runner instead of as native runners. yum-only RHEL (pre-8) isn't covered
  # here -- it shares setup_msmtp_dnf's logic with the dnf case below, just
  # under a different binary name.
  install-script-mta:
    # Skipped on tag pushes, same reasoning as install-script above. This one
    # also pulls four Docker Hub images anonymously from shared GitHub runner
    # IPs, so keeping it off the release path means a Docker Hub rate limit can
    # never block publishing a release.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: shellcheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arch
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm --needed sudo curl tar coreutils which
          - name: fedora
            image: fedora:latest
            # util-linux for `su` -- this base image doesn't include it.
            bootstrap: dnf -y install sudo curl tar coreutils which util-linux
          - name: rhel (rockylinux, via EPEL)
            image: rockylinux:9
            # curl/coreutils here are the -minimal/-single variants the base
            # image already ships; installing the full packages alongside
            # them conflicts (see setup_msmtp_dnf's EPEL handling for msmtp
            # itself, exercised by this job).
            bootstrap: dnf -y install sudo tar which
          - name: opensuse
            image: opensuse/tumbleweed:latest
            bootstrap: zypper --non-interactive install sudo curl tar coreutils which
    steps:
      - uses: actions/checkout@v7
      - name: "${{ matrix.name }}: msmtp setup installs a working sendmail"
        run: |
          docker run --rm -v "$PWD/install.sh:/work/install.sh:ro" "${{ matrix.image }}" bash -euxc '
            ${{ matrix.bootstrap }}
            curl -fsSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
            chmod +x /usr/local/bin/cosign
            useradd -m -s /bin/bash runner
            echo "runner ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/runner
            chmod 0440 /etc/sudoers.d/runner
            su -s /bin/bash runner -c "CHIMNEY_SKIP_SYSTEMD=1 CHIMNEY_MTA=yes bash /work/install.sh"
            # Checked as root, not via su: a non-login su on some distros
            # (openSUSE) strips PATH down to exclude /usr/sbin, where sendmail
            # lives -- a test-harness quirk, not something a real login shell hits.
            command -v sendmail
            test -e /etc/msmtprc
