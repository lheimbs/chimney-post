# TEMPORARY -- evidence for the rustls investigation, not a permanent workflow.
#
# On main, `cargo build --target aarch64-unknown-linux-gnu` fails: matrix-sdk's
# default features pull in openssl-sys (reqwest -> hyper-tls -> native-tls)
# without `vendored`, so its build script needs aarch64 OpenSSL headers and a
# cross pkg-config sysroot that `gcc-aarch64-linux-gnu` does not provide.
#
# This job exists to demonstrate that the rustls switch in this PR removes that
# blocker. Either delete it before merge, or keep it as a permanent guard
# against something re-introducing a native-TLS dependency. It is a separate
# file so it can be dropped without touching ci.yml or the CI badge.
name: Cross-build check (temporary)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-aarch64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-aarch64
      # Debug rather than release: the point is to prove that every build script
      # and the final link succeed for a foreign target, and a debug build
      # exercises openssl-sys (absent now), ring's asm, and libsqlite3-sys's
      # bundled C without paying for LTO + codegen-units=1.
      - name: Cross-build for aarch64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --locked --target aarch64-unknown-linux-gnu
      - name: Confirm the binary is an aarch64 ELF
        run: file target/aarch64-unknown-linux-gnu/debug/chimney-post
      # Guards the actual invariant: nothing in the tree may depend on OpenSSL.
      - name: Assert openssl-sys is absent from the dependency graph
        run: |
          if cargo tree -e normal,build -i openssl-sys >/dev/null 2>&1; then
            echo "::error::openssl-sys is back in the dependency graph" >&2
            cargo tree -e normal,build -i openssl-sys >&2
            exit 1
          fi
          echo "openssl-sys is not in the dependency graph"
