name: Release

on:
  push:
    tags:
      # Exact `vMAJOR.MINOR.PATCH` only. A looser `v*.*.*` also matches
      # prerelease tags like `v1.0.0-rc.1`, which would publish as a normal
      # "latest" release.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Never cancel a release mid-flight: a partially published release is worse
# than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The release tag. Tag push is the only trigger, so this is always the tag
  # name. Every artifact name, attestation subject and verification command
  # derives from this one value.
  VERSION: ${{ github.ref_name }}

jobs:
  # Gate the whole release on the same checks main gets. Tag pushes don't
  # trigger ci.yml on their own, so it's invoked here as a reusable workflow.
  # ci.yml's install-script jobs skip themselves on a tag ref: they install the
  # currently-published release, which has nothing to do with the commit being
  # released and would make each release depend on the previous one.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build natively on each architecture rather than cross-compiling.
          # Cross-compiling aarch64 does work now that the dependency tree is
          # OpenSSL-free (rustls-tls, bundled SQLite) -- this is a simplicity
          # choice, not a hard requirement: no cross toolchain or cross
          # pkg-config sysroot to install or maintain.
          #
          # Runner versions are pinned, not `ubuntu-latest`, because the runner's
          # glibc sets the floor for where these binaries will run: 24.04 is
          # glibc 2.39, so the binaries need Ubuntu 24.04+ / Debian 13+. Bumping
          # this raises that floor -- a user-visible compatibility change, so it
          # is a deliberate edit here rather than a silent `ubuntu-latest` drift.
          # 22.04 (glibc 2.35) would also cover Debian 12, but those images begin
          # deprecation on 2026-09-17 and are unsupported after 2027-04-17.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Pinned to 1.93 to match ci.yml: Rust 1.94+ fails `cargo build` with a
      # query-depth overflow on matrix-sdk's huge `Client::sync()` future
      # (matrix-org/matrix-rust-sdk#6254). Lift once this repo bumps matrix-sdk
      # to 0.16.1+/0.17.0+, which fixed it.
      - uses: dtolnay/rust-toolchain@841e5d09118f0311af26ce5ba303c1f15b358772 # 1.93
        with:
          targets: ${{ matrix.target }}
      # Deliberately no build cache. This job's output is signed and carries
      # SLSA provenance; a poisoned cache entry would produce a compromised
      # binary with a perfectly valid signature and attestation. Releases are
      # rare, so a cold build costs little.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      # Built to be byte-identical across rebuilds of the same commit, so the
      # tarball digest in the signature and the SLSA attestation can be
      # independently reproduced. tar defaults (member order, mtimes, uid/gid,
      # pax atime/ctime headers) and gzip's embedded timestamp are all sources
      # of nondeterminism, hence the flags:
      #   --sort=name          stable member order
      #   --format=ustar       no pax extended headers (which carry a/ctime)
      #   --mtime=@$EPOCH      commit time, not build time
      #   --owner/--group=0    no runner-specific ownership
      #   gzip -n              omit gzip's own timestamp + original filename
      # Note this makes the *archive* reproducible; whether rustc emits an
      # identical binary is a separate question this doesn't claim to answer.
      - name: Package
        run: |
          # The default `run` shell is `bash -e`, without pipefail -- so without
          # this a failing tar would be masked by gzip exiting 0 on empty input.
          set -eo pipefail
          mkdir -p staging
          cp target/${{ matrix.target }}/release/chimney-post staging/
          # Guarded because tar treats an empty --mtime as a bogus date and
          # still writes an archive rather than failing.
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          case "$SOURCE_DATE_EPOCH" in
            ''|*[!0-9]*) echo "::error::could not resolve commit timestamp" >&2; exit 1 ;;
          esac
          tar --sort=name \
              --format=ustar \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              -cf - -C staging chimney-post \
            | gzip -9n > "chimney-post-${VERSION}-${{ matrix.target }}.tar.gz"
      # Confirms the binary actually loads and runs on this architecture -- a
      # linker or glibc problem shows up as a loader failure here rather than in
      # a user's hands. There's no --version flag, so this asserts the binary
      # reaches its own config loader and reports the missing file.
      - name: Smoke test
        run: |
          set -uo pipefail
          out=$(CHIMNEY_CONFIG=/nonexistent/chimney-post.toml ./staging/chimney-post 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "${rc:-0}" -ne 1 ]; then
            echo "::error::expected exit 1 from config load failure, got ${rc:-0}" >&2
            exit 1
          fi
          case "$out" in
            *"/nonexistent/chimney-post.toml"*) ;;
            *) echo "::error::binary did not reach its config loader" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-${{ matrix.target }}
          path: chimney-post-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
          retention-days: 7

  # Native per-arch builds, same reasoning and same two runners as `build`
  # above -- avoids QEMU emulation for arm64.
  #
  # Pushed by digest with no tag of any kind: a tag here would be a publicly
  # pullable, permanently unsigned artifact (only the finished index digest
  # gets signed below), and on a partial failure -- `fail-fast: false` means
  # one arch can fail alone -- it would leave a dangling half-release in the
  # registry. The digests travel to docker-sign-attest as artifacts instead.
  docker-build-push:
    needs: ci
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # provenance: false -- docker-sign-attest generates SLSA provenance for
      # the finished multi-arch index instead, so buildx's own per-arch
      # provenance attachment would just be redundant (and would attach to
      # the wrong subject: a per-arch manifest, not the index users pull).
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          set -eo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::unexpected digest format '$digest'" >&2; exit 1 ;;
          esac
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  # Assembles the per-arch digests into the multi-arch index, then applies the
  # same trust chain the tarballs get in sign-attest below: a keyless cosign
  # signature over the index digest (not a tag, so the signature can't
  # silently start covering different bytes if a tag is later repointed) plus
  # SLSA build provenance attached to the registry.
  #
  # `latest` is created only *after* signing succeeds. Otherwise a cosign
  # failure (Fulcio/Rekor outage, OIDC hiccup) would leave `latest` already
  # serving an unsigned image to every `docker pull`, failing the very
  # verification command the release notes hand users. $VERSION has to exist
  # before signing -- cosign signs an image that is already in the registry --
  # but it is an immutable, not-yet-advertised tag, and no GitHub Release
  # pointing at it is published unless this job succeeds.
  docker-sign-attest:
    needs: docker-build-push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4
      - name: Create the multi-arch index
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -eo pipefail
          # Both arches must be present: `fail-fast: false` lets one build
          # fail on its own, and a silently single-arch "multi-arch" release
          # is worse than a failed one.
          #
          # The guard counts the *same glob* the refs are built from, rather
          # than `find -type f`: the two agree only as long as
          # `merge-multiple: true` flattens the digests into this directory,
          # and if that ever stops being true `find` would still count 2
          # while `*` expanded to directory names, yielding a nonsense ref
          # like `...@sha256:docker-digest-amd64`.
          set -- *
          if [ "$#" -ne 2 ]; then
            echo "::error::expected 2 per-arch digests, found $#" >&2
            exit 1
          fi
          for d in "$@"; do
            if [ ! -f "$d" ]; then
              echo "::error::'$d' is not a digest file -- unexpected artifact layout" >&2
              exit 1
            fi
          done
          # shellcheck disable=SC2046 # deliberate word splitting: one ref per digest file
          docker buildx imagetools create \
            -t "ghcr.io/${{ github.repository }}:${{ env.VERSION }}" \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' "$@")
          digest=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ env.VERSION }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign the image with cosign (keyless)
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.manifest.outputs.digest }}"
      # Same rationale as the tarball verification step in sign-attest below:
      # runs the exact command the README/release notes hand to users.
      - name: Verify the signature the way users will
        run: |
          cosign verify "ghcr.io/${{ github.repository }}@${{ steps.manifest.outputs.digest }}" \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "${{ github.repository }}"
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      # Only now, with the digest signed and attested, does the tag most
      # people pull start pointing at it.
      - name: Promote to latest
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/${{ github.repository }}:latest" \
            "ghcr.io/${{ github.repository }}@${{ steps.manifest.outputs.digest }}"

  sign-attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4
      - name: Sign artifacts with cosign (keyless)
        working-directory: artifacts
        run: |
          for f in *.tar.gz SHA256SUMS; do
            cosign sign-blob --yes --bundle="$f.bundle" "$f"
          done
      # Runs the same command the README and the release notes hand to users,
      # against the artifacts just signed, so the published instructions can't
      # silently drift from what cosign actually accepts. cosign v3 writes the
      # standardised Sigstore bundle (`...bundle.v0.3+json`) rather than v2's
      # legacy format, and older clients need an explicit --new-bundle-format
      # to read it -- exactly the kind of change this step is here to catch.
      #
      # The identity is built from `github.workflow_ref`, which is already
      # `<owner>/<repo>/.github/workflows/release.yml@<ref>` -- the same value
      # that ends up in the certificate SAN, so it matches without hardcoding
      # the ref and stays correct if this workflow is ever renamed or moved.
      - name: Verify the signatures the way users will
        working-directory: artifacts
        run: |
          set -eo pipefail
          for f in *.tar.gz SHA256SUMS; do
            echo "::group::verify $f"
            cosign verify-blob "$f" \
              --bundle "$f.bundle" \
              --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-repository "${{ github.repository }}"
            echo "::endgroup::"
          done
      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          # Listed explicitly rather than globbed: adding a target to the build
          # matrix should be a deliberate decision here too, not something that
          # silently starts shipping unattested.
          subject-path: |
            artifacts/chimney-post-${{ env.VERSION }}-x86_64-unknown-linux-gnu.tar.gz
            artifacts/chimney-post-${{ env.VERSION }}-aarch64-unknown-linux-gnu.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signatures
          path: |
            artifacts/*.bundle
            artifacts/SHA256SUMS
          retention-days: 7

  release:
    # Both needed so the GitHub Release (which documents both the tarballs
    # and the container image) never goes live before either is actually
    # published and signed -- a partially-referenced release is worse than a
    # slow one.
    needs: [sign-attest, docker-sign-attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: signatures
          name: signatures
      - name: Stage release assets
        run: mv signatures/* artifacts/
      # The tarballs and the checksums travel as separate artifacts; re-check
      # them here so we can't publish assets that don't match what was signed.
      - name: Verify checksums against signed SHA256SUMS
        working-directory: artifacts
        run: sha256sum -c SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.VERSION }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
            artifacts/*.bundle
          body: |
            ## Verification

            Replace `<target>` below with `x86_64-unknown-linux-gnu` or `aarch64-unknown-linux-gnu`.

            ### SHA256 Checksums

            Download `SHA256SUMS` alongside the tarballs and verify:

            ```sh
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            ### Signature (cosign / sigstore)

            The tarballs and `SHA256SUMS` are signed with cosign keyless signatures using the GitHub Actions OIDC
            identity of this repository's release workflow. Signatures are recorded in the public
            [Rekor](https://github.com/sigstore/rekor) transparency log.

            Install [cosign](https://github.com/sigstore/cosign) **v3.0 or newer** -- these are standard Sigstore
            bundles, which cosign v2.6.x reads only with `--new-bundle-format` and v2.5 and older cannot read.
            Then verify a tarball:

            ```sh
            cosign verify-blob chimney-post-${{ env.VERSION }}-<target>.tar.gz \
              --bundle chimney-post-${{ env.VERSION }}-<target>.tar.gz.bundle \
              --certificate-identity "https://github.com/lheimbs/chimney-post/.github/workflows/release.yml@refs/tags/${{ env.VERSION }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-repository "lheimbs/chimney-post"
            ```

            Verifying `SHA256SUMS` itself is the cheaper path if you downloaded several assets -- check its
            signature once, then `sha256sum -c` the rest:

            ```sh
            cosign verify-blob SHA256SUMS \
              --bundle SHA256SUMS.bundle \
              --certificate-identity "https://github.com/lheimbs/chimney-post/.github/workflows/release.yml@refs/tags/${{ env.VERSION }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-repository "lheimbs/chimney-post"
            ```

            ### Build Provenance (SLSA)

            Build provenance attestations are stored in GitHub's native attestation store.
            Verify with the GitHub CLI:

            ```sh
            gh attestation verify chimney-post-${{ env.VERSION }}-<target>.tar.gz \
              --repo lheimbs/chimney-post \
              --signer-workflow lheimbs/chimney-post/.github/workflows/release.yml
            ```

            ## Container Image

            A multi-arch (amd64/arm64) distroless image is published to GHCR:

            ```sh
            docker pull ghcr.io/lheimbs/chimney-post:${{ env.VERSION }}
            ```

            It carries the same cosign keyless signature and SLSA build provenance as the
            tarballs above, under the same GitHub Actions OIDC identity:

            ```sh
            cosign verify ghcr.io/lheimbs/chimney-post:${{ env.VERSION }} \
              --certificate-identity "https://github.com/lheimbs/chimney-post/.github/workflows/release.yml@refs/tags/${{ env.VERSION }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-repository "lheimbs/chimney-post"

            gh attestation verify oci://ghcr.io/lheimbs/chimney-post:${{ env.VERSION }} \
              --repo lheimbs/chimney-post \
              --signer-workflow lheimbs/chimney-post/.github/workflows/release.yml
            ```
