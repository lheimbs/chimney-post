[package]
name = "chimney-post"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Local-only SMTP server forwarding email to Matrix with E2EE"
rust-version = "1.96"

[dependencies]
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.8"
thiserror = "2.0.18"
# These four are matrix-sdk's own defaults, re-listed verbatim so a change to
# that set is a deliberate edit here rather than a silent one upstream.
# `rustls-aws-lc-rs` (named `rustls-tls` before 0.19) keeps TLS off OpenSSL, so
# there is no openssl-sys build script needing target-arch OpenSSL headers.
matrix-sdk = { version = "0.19.1", default-features = false, features = [
    "e2e-encryption",
    "automatic-room-key-forwarding",
    "sqlite",
    "rustls-aws-lc-rs",
] }
url = "2.5.7"
minijinja = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
sd-notify = "0.4"
validator = "0.20"
# MIME parsing for the SMTP DATA block: multipart traversal, Content-Transfer-
# Encoding decoding (quoted-printable / base64) and RFC 2047 encoded-words in
# headers. Pure Rust, so it adds no C toolchain requirement to the release and
# container builds; its only notable transitive dependency is encoding_rs (via
# `charset`) for non-UTF-8 part charsets.
mailparse = "0.17"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "io-util", "net", "time"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
